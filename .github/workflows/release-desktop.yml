name: release-desktop

# 打 v* tag 时自动构建桌面端安装包并发 Release；也可在 Actions 页手动触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v0.1.1）。留空则使用当前 ref。'
        required: false
      mirror_base:
        description: '更新镜像根地址（如 https://dl.example.com/private-cinema）。留空则跳过镜像清单。'
        required: false

# softprops/action-gh-release 建 Release / 传附件需要 contents: write
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # go.mod 要求 go 1.27.3；setup-go 装 stable 后，由 go 自动下载所需工具链
      GOTOOLCHAIN: auto
      GOFLAGS: -buildvcs=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install packaging deps (NSIS / rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis rpm fakeroot zip

      - name: Install frontend deps
        working-directory: desktop
        run: bun install

      # 红果加密分集靠 ffmpeg 解密：Windows 包内置 ffmpeg.exe（红果播放开箱可用）。
      # 脚本会下载 Gyan essentials 包并校验固定 SHA-256，同时把上游 GPLv3 全文落到
      # resources/ffmpeg/COPYING.GPLv3 —— 分发 GPL 二进制必须随附许可文本。
      # 失败不致命：退化成「依赖系统 ffmpeg」，应用里有诊断与修复指引。
      - name: Bundle ffmpeg (Windows + Linux)
        working-directory: desktop
        run: |
          set +e
          bash scripts/fetch-ffmpeg.sh all
          status=$?
          if [ $status -ne 0 ]; then
            echo "::warning title=fetch-ffmpeg::内置 ffmpeg 准备失败，本次包只能依赖系统 ffmpeg"
          fi
          ls -lh resources/windows-amd64 resources/linux-amd64 resources/ffmpeg 2>/dev/null || true
          exit 0

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME}"; fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "resolved: version=$V tag=v$V"

      - name: Sync app version from tag
        run: |
          V="${{ steps.ver.outputs.version }}"
          sed -i -E "s/(version:[[:space:]]*\")[^\"]+(\")/\1${V}\2/" desktop/mygo.config.ts
          grep -n 'version' desktop/mygo.config.ts

      - name: Build Linux + Windows packages
        working-directory: desktop
        env:
          # 签名更新用的私钥（`mygo keygen` 生成的 mygo-update.key 内容），放在仓库 Secrets。
          # 没有它仍能出包，但不会有可自更新的签名清单。
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go run github.com/egoist/mygo/cmd/mygo@v0.9.0 build -platform linux/amd64,windows/amd64

      - name: Package Windows portable zip + checksums
        run: |
          V="${{ steps.ver.outputs.version }}"
          # 便携包必须带上 ffmpeg.exe 与许可文本：只看「exe 一个文件」的旧做法会让红果播不了。
          ( cd desktop/build/windows-amd64 && zip -q -9 -r "private-cinema-${V}-windows-amd64-portable.zip" \
              "私人影院.exe" ffmpeg.exe ffmpeg-LICENSE.txt ffmpeg-NOTICE.txt COPYING.GPLv3 ffmpeg/ )
          # 只为实际存在的产物生成校验和：更新清单(update-*.json)仅在配置了签名私钥时才产出，
          # 未配置时不能让它把整步 sha256sum 拖挂。
          ( cd desktop/build
            : > SHA256SUMS
            for f in \
              linux-amd64/*.deb linux-amd64/*.rpm linux-amd64/*.tar.gz linux-amd64/update-*.json \
              windows-amd64/*.exe windows-amd64/*.zip windows-amd64/update-*.json ; do
              if [ -f "$f" ]; then sha256sum "$f" >> SHA256SUMS; fi
            done
            echo '--- SHA256SUMS ---'
            cat SHA256SUMS
          )
          echo '--- update manifests (可能不存在：无签名私钥时) ---'
          cat desktop/build/linux-amd64/update-*.json desktop/build/windows-amd64/update-*.json 2>/dev/null || true
          echo '--- build dir ---'
          ls -lh desktop/build/linux-amd64 desktop/build/windows-amd64

      # 镜像清单：把 update-<target>.json 里的归档地址改指到镜像（MIRROR_BASE）。
      # 只做「改写 + 打包上传为 artifact」，真正推到对象存储由 MIRROR_BASE 的持有者在
      # workflow_dispatch 里填地址后手动 rsync/ossutil；没有填就跳过，不影响常规发布。
      # 客户端拿到镜像地址后仍会用内置公钥验签（见 docs/update-mirror.md）。
      - name: Build mirror manifests
        if: ${{ inputs.mirror_base != '' }}
        working-directory: desktop
        run: |
          V="${{ steps.ver.outputs.version }}"
          for t in windows-amd64 linux-amd64; do
            src="build/$t/update-$t.json"
            [ -f "$src" ] || { echo "::warning::$src 不存在（可能缺签名私钥），跳过"; continue; }
            go run ./cmd/update-mirror -in "$src" -out "dist-mirror/$t/update-$t.json" \
              -base "${{ inputs.mirror_base }}" -target "$t"
            mkdir -p "dist-mirror/$t"
            cp build/$t/*.tar.gz build/$t/*.delta "dist-mirror/$t/" 2>/dev/null || true
          done
          echo '--- dist-mirror ---'
          find dist-mirror -type f | sort

      - name: Upload mirror bundle
        if: ${{ inputs.mirror_base != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: privatecinema-mirror-${{ steps.ver.outputs.version }}
          path: desktop/dist-mirror/**
          if-no-files-found: warn

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PrivateCinema ${{ steps.ver.outputs.tag }}
          draft: false
          generate_release_notes: true
          # 更新清单(update-*.json)可能因缺少签名私钥而缺席；不要让个别文件缺失导致整个发布失败。
          fail_on_unmatched_files: false
          files: |
            desktop/build/linux-amd64/*.deb
            desktop/build/linux-amd64/*.rpm
            desktop/build/linux-amd64/*.tar.gz
            desktop/build/linux-amd64/update-*.json
            desktop/build/windows-amd64/*setup*.exe
            desktop/build/windows-amd64/*portable*.zip
            # 签名自更新清单里 windows 的 url 指向这个 tar.gz；漏传会让 Windows 在线更新 404。
            desktop/build/windows-amd64/*.tar.gz
            desktop/build/windows-amd64/*.delta
            desktop/build/linux-amd64/*.delta
            desktop/build/windows-amd64/update-*.json
            desktop/build/SHA256SUMS

      - name: Upload build artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: privatecinema-desktop-${{ steps.ver.outputs.version }}
          path: |
            desktop/build/linux-amd64/*
            desktop/build/windows-amd64/*
            desktop/build/SHA256SUMS
