name: windows-build

# Windows 客户端 CI：静态检查 + 单测 + 构建。
# 只做可重复验证的三件事，不做打包、不发版、不启动应用窗口。
# 触发范围限定在 windows/ 与其工作流本身，避免 iOS 改动白白消耗 runner。

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: typecheck / test / build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 锁 20.19.0：与本地一致，且是当前依赖栈的硬上限（见 windows/AGENTS.md §2）。
      # 升到 22 会改变 vite / vitest 的解析行为，验证结果就不再可重复。
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建
        run: npm run build

      - name: 校验构建产物
        shell: pwsh
        run: |
          $required = @(
            'out/main/index.js',
            'out/preload/index.js',
            'out/renderer/index.html'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Host "::error::缺少构建产物 $file"
              exit 1
            }
            $size = (Get-Item $file).Length
            Write-Host "$file  $size bytes"
          }
