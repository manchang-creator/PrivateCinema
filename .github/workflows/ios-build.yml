name: iOS 编译检查与截图预览

# 每次 push 到 main 自动触发；也可在 Actions 页面手动触发。
# 本仓库开发环境无 Mac：CI 负责编译验证 + 模拟器自动导航截图预览。
# 工程由 Tuist 生成（Project.swift + Modules/ 下的本地 Swift Package）。

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # 固定 Tuist 版本，保证 CI 可复现
  TUIST_VERSION: "4.215.0"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 镜像预装多个 Xcode，选 16 及以上的最新版本
      - name: 选择 Xcode 16+
        run: |
          ls -d /Applications/Xcode*.app
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | grep -E "Xcode_(1[6-9]|2[0-9])" | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      # mise 安装固定版本的 Tuist（官方仓库自身也用 mise 管理 CLI 版本）
      - name: 安装 Tuist
        uses: jdx/mise-action@v3
        with:
          install: false

      - name: 安装固定版本 Tuist
        run: |
          mise use -g "tuist@$TUIST_VERSION"
          mise install
          tuist version

      # 本地包依赖无需 tuist install（那是给 Tuist/Package.swift 的外部依赖用的）
      # 失败时把错误写进 job summary，便于在无日志权限时定位
      - name: 生成工程
        run: |
          set +e
          tuist generate --no-open > generate.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            # ::error:: 写入 check run annotations（公开可读），无日志权限时也能定位
            python3 - <<'PY'
          import re
          text = open("generate.log", encoding="utf-8", errors="replace").read()
          lines = [l.rstrip() for l in text.splitlines() if l.strip()]
          picks = [l for l in lines if re.search(r"error:|Error:|Fatal|fatal", l)] or lines[-40:]
          msg = " | ".join(picks[:40])
          for i in range(0, min(len(msg), 4000), 400):
              print("::error title=tuist-generate::" + msg[i:i+400])
          PY
            exit $status
          fi

      # 失败时把生成日志上传为 artifact（无日志权限时可通过公开 API 读取）
      - name: 上传生成日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tuist-generate-log
          path: generate.log
          if-no-files-found: ignore

      # generic 模拟器目标不依赖具体机型名称；模拟器构建无需签名
      # 编译错误写进 job summary，便于在无日志权限时定位
      - name: 编译（iOS 模拟器目标）
        run: |
          set +e
          xcodebuild \
            -workspace PrivateCinema.xcworkspace \
            -scheme PrivateCinema \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1
          status=$?
          grep -E "error:" build.log | sort -u | head -60 > errors.log || true
          if [ $status -ne 0 ]; then
            python3 - <<'PY'
          import os
          path = "errors.log"
          lines = [l.strip() for l in open(path, encoding="utf-8", errors="replace") if l.strip()] if os.path.exists(path) else []
          if not lines:
              lines = ["(no error: lines captured; see build-log artifact)"]
          msg = " | ".join(lines[:30])
          for i in range(0, min(len(msg), 6000), 500):
              print("::error title=xcodebuild::" + msg[i:i+500])
          PY
            tail -30 build.log
            exit $status
          fi
          tail -10 build.log

      - name: 上传编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            errors.log
          if-no-files-found: ignore

      - name: 启动 iPhone 模拟器
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE "[A-F0-9-]{36}" | head -1)
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"

      # 单元测试是硬门禁：失败直接让 CI 变红（截图步骤的容忍策略不适用于测试）
      - name: 运行单元测试
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace PrivateCinema.xcworkspace \
            -scheme PrivateCinema \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:PrivateCinemaTests \
            -resultBundlePath UnitTestResult.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee unit-test.log | grep -E "Test Case|Test Suite|error:|Failing|Restarting|Crash" | tail -60

      # 失败用例写进 check run annotations（公开可读）：job 日志需要 admin 权限，
      # 无 Mac 的协作环境只能靠 annotations 定位测试失败
      - name: 汇总测试失败
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          if not os.path.exists("unit-test.log"):
              print("::error title=unit-test::(unit-test.log 未生成，测试可能启动即崩溃)")
              raise SystemExit(0)
          lines = [l.rstrip() for l in open("unit-test.log", encoding="utf-8", errors="replace")]
          body = [l for l in lines if l.strip()]

          def emit(title, picked):
              # workflow command 的消息体需转义 % 与回车换行，否则注解被截断或丢弃
              msg = " | ".join(picked).replace("%", "%25").replace("\r", "").replace("\n", " ")
              for i in range(0, min(len(msg), 9000), 900):
                  print(f"::error title={title}::" + msg[i:i+900])

          # 失败用例 / 断言 / 崩溃关键字
          picked = [l for l in body if re.search(
              r"Test Case .* failed|error:|Assertion Failure|Restarting after|Crash|EXC_|Fatal error", l)]
          if picked:
              emit("unit-test", picked[:20])
          # 原始日志尾部：崩溃与信号信息只出现在这里
          emit("unit-test-tail", body[-30:])

          # 完整摘要写进 step summary（公开页面可直接查看）
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as out:
                  out.write("## 单元测试失败摘要\n\n```\n")
                  out.write("\n".join(body[-200:]))
                  out.write("\n```\n")
          PY

      - name: 上传测试日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: unit-test.log
          if-no-files-found: ignore

      # 失败时导出 xcresult 崩溃诊断并直接打印到 job 日志
      - name: 导出崩溃诊断
        if: failure()
        run: |
          mkdir -p crashdiag
          xcrun xcresulttool export diagnostics \
            --path UnitTestResult.xcresult \
            --output-path crashdiag || true
          # 模拟器进程崩溃报告会落在宿主 DiagnosticReports
          cp ~/Library/Logs/DiagnosticReports/*.ips crashdiag/ 2>/dev/null || true
          python3 - <<'PY'
          import json, glob
          for path in sorted(glob.glob('crashdiag/**/PrivateCinema*.ips', recursive=True)):
              with open(path, encoding='utf-8', errors='ignore') as f:
                  f.readline()
                  try:
                      d = json.load(f)
                  except Exception as e:
                      print(path, 'parse error:', e); continue
              print('=====', path)
              print('exception:', json.dumps(d.get('exception'), ensure_ascii=False))
              print('termination:', json.dumps(d.get('termination'), ensure_ascii=False))
              print('asi:', json.dumps(d.get('asi'), ensure_ascii=False))
              tid = d.get('faultingThread', 0)
              imgs = d.get('usedImages', [])
              t = d.get('threads', [])[tid] if tid < len(d.get('threads', [])) else None
              if t:
                  print('faulting thread queue:', t.get('queue'))
                  for fr in t.get('frames', [])[:12]:
                      i = fr.get('imageIndex')
                      name = imgs[i].get('name', '?') if i is not None and i < len(imgs) else '?'
                      print('   ', name, fr.get('symbol', '?'), '+' + str(fr.get('symbolLocation', '')))
                  print('    ... total frames:', len(t.get('frames', [])))
              print()
          PY

      - name: 上传测试诊断产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics
          path: crashdiag
          if-no-files-found: ignore

      - name: 运行 UI 测试生成截图
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace PrivateCinema.xcworkspace \
            -scheme PrivateCinema \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -only-testing:PrivateCinemaUITests \
            -resultBundlePath ScreenshotResult.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -60 \
            || echo "::warning::UI 测试未全部通过，已捕获的截图仍会上传"

      - name: 导出截图
        if: always()
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments \
            --path ScreenshotResult.xcresult \
            --output-path screenshots \
            || echo "::warning::截图导出失败"
          python3 - <<'PY'
          import json, os, shutil
          try:
              p = os.path.join("screenshots", "manifest.json")
              if os.path.exists(p):
                  with open(p, encoding="utf-8") as f:
                      data = json.load(f)
                  items = data if isinstance(data, list) else data.get("attachments", [])
                  # manifest 每项是测试对象，attachments 嵌在内层
                  for a in items:
                      if not isinstance(a, dict):
                          continue
                      entries = a["attachments"] if "attachments" in a else [a]
                      for att in entries:
                          src = os.path.join("screenshots", att.get("exportedFileName", ""))
                          # suggested name 形如 "01-首页_0_<uuid>"，截取友好名
                          name = (att.get("suggestedHumanReadableName") or "").split("_")[0]
                          if src and os.path.exists(src) and name:
                              os.replace(src, os.path.join("screenshots", name + ".png"))
          except Exception as e:
              print("rename skipped:", e)
          PY
          ls screenshots | head -30

      - name: 上传截图产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: screenshots
          if-no-files-found: warn

  # 手动触发的未签名 ipa 打包（供 SideStore / AltStore 等手机端自签工具使用）。
  # 免费签名无法在 CI 完成，由手机上的 SideStore 用个人 Apple ID 完成签名（7 天有效）。
  package-ipa:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 Xcode 16+
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | grep -E "Xcode_(1[6-9]|2[0-9])" | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: 安装 Tuist
        uses: jdx/mise-action@v3
        with:
          install: false

      - name: 安装固定版本 Tuist
        run: |
          mise use -g "tuist@$TUIST_VERSION"
          mise install
          tuist version

      - name: 生成工程
        run: |
          set +e
          tuist generate --no-open > generate.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            # ::error:: 写入 check run annotations（公开可读），无日志权限时也能定位
            python3 - <<'PY'
          import re
          text = open("generate.log", encoding="utf-8", errors="replace").read()
          lines = [l.rstrip() for l in text.splitlines() if l.strip()]
          picks = [l for l in lines if re.search(r"error:|Error:|Fatal|fatal", l)] or lines[-40:]
          msg = " | ".join(picks[:40])
          for i in range(0, min(len(msg), 4000), 400):
              print("::error title=tuist-generate::" + msg[i:i+400])
          PY
            exit $status
          fi

      - name: 编译真机 Release（未签名）
        run: |
          xcodebuild \
            -workspace PrivateCinema.xcworkspace \
            -scheme PrivateCinema \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: 打包为 ipa
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" -maxdepth 3 | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry PrivateCinema-unsigned.ipa Payload
          ls -lh PrivateCinema-unsigned.ipa

      - name: 上传 ipa 产物
        uses: actions/upload-artifact@v4
        with:
          name: PrivateCinema-unsigned-ipa
          path: PrivateCinema-unsigned.ipa
          if-no-files-found: error
