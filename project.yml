name: PrivateCinema
options:
  bundleIdPrefix: com.private
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  PrivateCinema:
    type: application
    platform: iOS
    sources:
      - path: PrivateCinema
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 私人影院
        UILaunchScreen: {}
        UIBackgroundModes: [audio, picture-in-picture]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PrivateCinemaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PrivateCinemaUITests
    dependencies:
      - target: PrivateCinema
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.private.PrivateCinemaUITests
        TEST_TARGET_NAME: PrivateCinema
  PrivateCinemaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrivateCinemaTests
    dependencies:
      - target: PrivateCinema
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.private.PrivateCinemaTests
        # 宿主在 App 内运行，可访问 MockContent 等全部 App 符号
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PrivateCinema.app/PrivateCinema
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  PrivateCinema:
    build:
      targets:
        PrivateCinema: all
        PrivateCinemaUITests: [test]
        PrivateCinemaTests: [test]
    test:
      targets:
        - PrivateCinemaTests
        - PrivateCinemaUITests
